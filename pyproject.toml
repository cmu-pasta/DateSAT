[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datesat"
version = "0.1.0"
description = "DateSAT: SMT encodings for date and period constraints."
readme = "README.md"
requires-python = ">=3.10"

# Runtime dependencies only; requirements.txt also lists the dev, plotting and LLM tools.
dependencies = [
  "z3-solver>=4.12.2",
  "python-dateutil>=2.8.2",
  "lark-parser>=0.11.0",
]

[project.optional-dependencies]
# DateSATBench's analysis/ (training the router, the report), run in DateSat's environment:
# pip install -e ".[analysis]". Keep it in step with DateSATBench's own analysis extra.
analysis = [
  "matplotlib>=3.5",
  "numpy>=1.21",
  "pandas",
  "scipy",
  # the version that trained DateSATBench's committed router and fold models; another may
  # train different forests from the same seed
  "scikit-learn==1.5.2",
  "joblib",
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
# datesat/__init__.py imports the bounded and bitvector solvers from future_work/,
# so both packages are installed.
include = ["datesat*", "future_work*"]

[tool.setuptools.package-data]
# The router's bundled model (see docs/router.md).
datesat = ["router/*.json"]
