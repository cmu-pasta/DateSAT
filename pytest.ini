# pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -m "not differential and not semantics_vs_libraries"
markers =
    simple: marks tests as simple solver tests
    epoch_days: marks tests as epoch_days solver tests
    hybrid_init_ymd: marks tests as hybrid YMD-initial solver tests (int implementation)
    hybrid_init_epoch: marks tests as hybrid epoch-initial solver tests (int implementation)
    alpha_beta: marks tests as alpha-beta solver tests
    integer: marks tests as integer implementation tests
    integration: marks tests as integration tests
    differential: differential tests of every encoding on random constraints, models checked against the reference semantics (tests/differential)
    semantics_vs_libraries: checks of the Verus reference semantics against Python datetime/dateutil and java.time, via the compiled Verus oracle (tests/semantics_vs_libraries)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
