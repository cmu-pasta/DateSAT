# pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -m "not bitvector"
markers =
    simple: marks tests as simple solver tests
    epoch_days: marks tests as epoch_days solver tests
    hybrid: marks tests as hybrid solver tests (bitvector implementation)
    hybrid_init_ymd: marks tests as hybrid YMD-initial solver tests (int implementation)
    hybrid_init_epoch: marks tests as hybrid epoch-initial solver tests (int implementation)
    alpha_beta: marks tests as alpha-beta solver tests
    bitvector: marks tests as bitvector implementation tests
    integer: marks tests as integer implementation tests
    integration: marks tests as integration tests
    enumeration: marks tests as enumeration baseline solver tests
    translation_validation: Z3 checks of the generated terms against the Verus spec (tests/translation_validation)
    spec_adequacy: checks of the Verus reference semantics and its transcriptions against the compiled Verus oracle, datetime and java.time (tests/spec_adequacy)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
